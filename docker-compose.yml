services:
  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./outputs:/app/outputs
    command: uvicorn grievance_triage.api.app:app --host 0.0.0.0 --port 8000

  dashboard:
    build: .
    env_file: .env
    ports:
      - "8501:8501"
    volumes:
      - ./outputs:/app/outputs
    command: streamlit run streamlit_app.py --server.address 0.0.0.0 --server.port 8501
