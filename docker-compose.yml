services:
  api:
    image: ${IMAGE_TAG:-ankursingh01/govt-grievancev1:lastest}
    build: .
    restart: always
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./outputs:/app/outputs
    command: uvicorn grievance_triage.api.app:app --host 0.0.0.0 --port 8000

  dashboard:
    image: ${IMAGE_TAG:-ankursingh01/govt-grievancev1:lastest}
    build: .
    restart: always
    env_file: .env
    ports:
      - "8501:8501"
    volumes:
      - ./outputs:/app/outputs
    command: streamlit run streamlit_app.py --server.address 0.0.0.0 --server.port 8501 --server.headless true --server.enableCORS false --server.enableXsrfProtection false


