[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grievance-triage"
version = "0.1.0"
dependencies = [
	"numpy>=1.26",
	"pandas>=2.2",
	"scikit-learn>=1.5",
	"torch>=2.5",
	"torchvision>=0.20",
	"mlflow>=2.17",
	"dagshub>=0.5",
	"python-dotenv>=1.0",
	"fastapi>=0.115",
	"uvicorn[standard]>=0.30",
	"pydantic-settings>=2.6",
	"sqlalchemy>=2.0",
	"psycopg[binary]>=3.2",
	"pgvector>=0.3",
	"sentence-transformers>=3.3",
	"langchain-core>=0.3",
	"langchain-google-genai>=2.0",
	"streamlit>=1.40",
]

[project.scripts]
grievance-triage = "grievance_triage.cli:main"
grievance-api = "grievance_triage.api.main:main"

[tool.setuptools.packages.find]
where = ["src"]
