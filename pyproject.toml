[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grievance-triage"
version = "0.1.0"
dependencies = [
	"numpy>=1.26",
	"pandas>=2.2",
	"scikit-learn>=1.5",
	"torch>=2.5",
	"mlflow>=2.17",
	"dagshub>=0.5",
	"python-dotenv>=1.0",
]

[project.scripts]
grievance-triage = "grievance_triage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
