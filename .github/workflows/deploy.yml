name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-to-ec2:
    name: Deploy Docker Hub image on EC2
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            mkdir -p ~/grievance-triage
            cd ~/grievance-triage

            # Write .env file from GitHub Secrets
            cat << 'EOF' > .env
            ${{ secrets.ENV_FILE }}
            EOF

            IMAGE_URI="ankursingh01/govt-grievancev1:lastest"

            # Pull latest image from Docker Hub
            docker pull "$IMAGE_URI"

            # Stop and remove all old containers to free ports 8000 & 8501
            docker ps -q | xargs -r docker rm -f || true
            docker rm -f grievance-api grievance-dashboard grievance-triage-api-1 grievance-triage-dashboard-1 || true

            # Run FastAPI API Container on Port 8000
            docker run -d \
              --name grievance-api \
              --restart unless-stopped \
              --env-file .env \
              -p 8000:8000 \
              "$IMAGE_URI" \
              uvicorn grievance_triage.api.app:app --host 0.0.0.0 --port 8000

            # Run Streamlit Dashboard Container on Port 8501
            docker run -d \
              --name grievance-dashboard \
              --restart unless-stopped \
              --env-file .env \
              -p 8501:8501 \
              "$IMAGE_URI" \
              streamlit run streamlit_app.py --server.address 0.0.0.0 --server.port 8501 --server.headless true --server.enableCORS false --server.enableXsrfProtection false
