name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-to-ec2:
    name: Deploy Docker Hub image on EC2
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            mkdir -p ~/grievance-triage
            cd ~/grievance-triage

            # Write .env file from GitHub Secrets
            cat << 'EOF' > .env
            ${{ secrets.ENV_FILE }}
            EOF

            IMAGE_URI="ankursingh01/govt-grievance:latest"

            # 1. Stop and remove all running containers
            docker ps -q | xargs -r docker rm -f || true
            docker rm -f grievance-api grievance-dashboard grievance-triage-api-1 grievance-triage-dashboard-1 || true

            # 2. Deep OS and Docker disk cleanup to free maximum space on EC2
            sudo journalctl --vacuum-time=1s || true
            sudo apt-get clean || true
            sudo rm -rf /var/lib/containerd/io.containerd.content.v1.content/ingest/* || true
            sudo rm -rf /var/lib/docker/tmp/* || true
            docker system prune -af --volumes || true
            docker builder prune -af || true

            # 3. Create 2GB swap if not already present (needed for 950MB model loading)
            if [ ! -f /swapfile ]; then
              sudo fallocate -l 2G /swapfile
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile
              echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab
            fi
            sudo swapon /swapfile 2>/dev/null || true

            # 4. Pull latest image from Docker Hub
            docker pull "$IMAGE_URI"

            # Run FastAPI API Container on Port 8000
            docker run -d \
              --name grievance-api \
              --restart unless-stopped \
              --env-file .env \
              -p 8000:8000 \
              "$IMAGE_URI" \
              uvicorn grievance_triage.api.app:app --host 0.0.0.0 --port 8000

