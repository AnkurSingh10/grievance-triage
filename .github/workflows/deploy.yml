name: Build & Deploy to AWS (ECR + EC2)

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    name: Build Docker Image & Push to AWS ECR
    runs-on: ubuntu-latest
    outputs:
      ecr_registry: ${{ steps.login-ecr.outputs.registry }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Pull from Docker Hub, Tag, and Push Image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
          DOCKER_HUB_IMAGE: ankursingh01/govt-grievancev1:lastest
        run: |
          docker pull $DOCKER_HUB_IMAGE
          docker tag $DOCKER_HUB_IMAGE $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker tag $DOCKER_HUB_IMAGE $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

  deploy-to-ec2:
    name: SSH into EC2 & Deploy Container
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            mkdir -p ~/grievance-triage
            cd ~/grievance-triage

            # Automatically write .env from GitHub Secrets
            cat << 'EOF' > .env
            ${{ secrets.ENV_FILE }}
            EOF

            # Automatically write docker-compose.yml on EC2
            cat << 'EOF' > docker-compose.yml
            services:
              api:
                image: ${IMAGE_TAG:-grievance-triage:latest}
                restart: always
                env_file: .env
                ports:
                  - "8000:8000"
                volumes:
                  - ./outputs:/app/outputs
                command: uvicorn grievance_triage.api.app:app --host 0.0.0.0 --port 8000

              dashboard:
                image: ${IMAGE_TAG:-grievance-triage:latest}
                restart: always
                env_file: .env
                ports:
                  - "8501:8501"
                volumes:
                  - ./outputs:/app/outputs
                command: streamlit run streamlit_app.py --server.address 0.0.0.0 --server.port 8501
            EOF

            # Configure AWS credentials and determine ECR Registry URL dynamically
            export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
            export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
            export AWS_DEFAULT_REGION="${{ secrets.AWS_REGION }}"

            AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
            ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com"

            # Log in to AWS ECR on EC2
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin $ECR_REGISTRY

            # Export Image Tag and run Docker Compose
            export IMAGE_TAG="${ECR_REGISTRY}/${{ secrets.ECR_REPOSITORY }}:latest"
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f

