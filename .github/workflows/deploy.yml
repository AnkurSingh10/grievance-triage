name: Deploy Direct from Docker Hub to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy-to-ec2:
    name: SSH into EC2 & Deploy Container from Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            mkdir -p ~/grievance-triage
            cd ~/grievance-triage

            # Automatically write .env from GitHub Secrets
            cat << 'EOF' > .env
            ${{ secrets.ENV_FILE }}
            EOF

            # Automatically write docker-compose.yml on EC2 using Docker Hub image directly
            cat << 'EOF' > docker-compose.yml
            services:
              api:
                image: ankursingh01/govt-grievancev1:lastest
                restart: always
                env_file: .env
                ports:
                  - "8000:8000"
                volumes:
                  - ./outputs:/app/outputs
                command: uvicorn grievance_triage.api.app:app --host 0.0.0.0 --port 8000

              dashboard:
                image: ankursingh01/govt-grievancev1:lastest
                restart: always
                env_file: .env
                ports:
                  - "8501:8501"
                volumes:
                  - ./outputs:/app/outputs
                command: streamlit run streamlit_app.py --server.address 0.0.0.0 --server.port 8501 --server.headless true --server.enableCORS false --server.enableXsrfProtection false
            EOF

            # Pull image directly from Docker Hub and run container
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
